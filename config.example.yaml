# Copy to config.yaml on the hardware laptop and edit values only.

robot:
  type: so101_follower
  id: so101_sorting_follower
  follower_port: /dev/tty.usbmodemFILL_FOLLOWER
  leader_port: /dev/tty.usbmodemFILL_LEADER
  calibration_dir: .cache/calibration/so101

policy:
  # Teammate ACT sorting policy on Hugging Face.
  # Can also be replaced with a local checkpoint path on the hardware laptop.
  path: adrrrobo/sorting_ACT
  device: auto
  fps: 30
  task: Sort cubes into the two boxes.

dataset:
  # Dataset listed by the ACT policy model card.
  repo_id: adrrrobo/Hackathon2_20260606_210708
  # Leave blank to load by repo_id; set only if the dataset is already local.
  local_path: ""

cameras:
  count: 1
  indices: [0]
  roles:
    front: 0
    side: 1
    wrist: 2
  width: 640
  height: 480
  fps: 30

safety:
  # LeRobot SO arms commonly expose normalized joint positions around -100..100.
  # Tighten these on the hardware laptop after observing the calibrated ranges.
  joint_names:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
  joint_limits:
    shoulder_pan: [-90, 90]
    shoulder_lift: [-90, 90]
    elbow_flex: [-90, 90]
    wrist_flex: [-90, 90]
    wrist_roll: [-90, 90]
    gripper: [0, 100]
  named_poses:
    home:
      shoulder_pan: 0
      shoulder_lift: 0
      elbow_flex: 0
      wrist_flex: 0
      wrist_roll: 0
      gripper: 50
    rest:
      shoulder_pan: 0
      shoulder_lift: -30
      elbow_flex: 45
      wrist_flex: 20
      wrist_roll: 0
      gripper: 50
  max_step_delta: 5.0
  step_delay_s: 0.12
  gripper_open: 80
  gripper_closed: 10

agent:
  model: claude-opus-4-8
  effort: xhigh
  max_turns: 8
  permission_mode: acceptEdits
  allowed_tools:
    - Read
    - Write
    - Bash

github:
  repo: https://github.com/0xsaltylollipop/hongkong-hack.git

server:
  host: 127.0.0.1
  port: 8765
  ui_dir: ui-prototypes
