# Copy to config.yaml on the hardware laptop and edit values only.

robot:
  type: so101_follower
  id: so101_sorting_follower
  follower_port: /dev/tty.usbmodemFILL_FOLLOWER
  leader_port: /dev/tty.usbmodemFILL_LEADER
  calibration_dir: .cache/calibration/so101

policy:
  path: /absolute/path/or/hf-user/act-policy-repo
  device: auto
  fps: 30
  task: Sort cubes into the two boxes.

dataset:
  repo_id: hf-user/so101-sorting-dataset
  local_path: /absolute/path/to/local/lerobot/dataset

cameras:
  count: 1
  indices: [0]
  width: 640
  height: 480
  fps: 30

safety:
  # LeRobot SO arms commonly expose normalized joint positions around -100..100.
  # Tighten these on the hardware laptop after observing the calibrated ranges.
  joint_names:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
  joint_limits:
    shoulder_pan: [-90, 90]
    shoulder_lift: [-90, 90]
    elbow_flex: [-90, 90]
    wrist_flex: [-90, 90]
    wrist_roll: [-90, 90]
    gripper: [0, 100]
  named_poses:
    home:
      shoulder_pan: 0
      shoulder_lift: 0
      elbow_flex: 0
      wrist_flex: 0
      wrist_roll: 0
      gripper: 50
    rest:
      shoulder_pan: 0
      shoulder_lift: -30
      elbow_flex: 45
      wrist_flex: 20
      wrist_roll: 0
      gripper: 50
  max_step_delta: 5.0
  step_delay_s: 0.12
  gripper_open: 80
  gripper_closed: 10

agent:
  model: claude-opus-4-8
  effort: xhigh
  max_turns: 8
  permission_mode: acceptEdits
  allowed_tools:
    - Read
    - Write
    - Bash

github:
  repo: https://github.com/0xsaltylollipop/hongkong-hack.git
